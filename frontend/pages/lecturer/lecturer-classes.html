  <body class="lecturer" data-api>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="lecturer.html"
          ><img
            class="brandmark-img"
            src="assets/images/neu-logo.png"
            alt="Logo Trường Đại học Kinh tế Quốc dân"
            width="44"
            height="44"
          />
          <div><b>NEU Feedback</b><small>ĐH Kinh tế Quốc dân</small></div></a
        >
        <div>
          <div class="nav-label">MENU</div>
          <nav class="nav" aria-label="Điều hướng chính">
            <a href="lecturer.html"
              ><span class="nav-icon"
                ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 10.5 12 3l9 7.5" />
                  <path d="M5.5 9.5V21h13V9.5" />
                  <path d="M9.5 21v-6h5v6" /></svg></span
              ><span>Trang chủ</span></a
            ><a class="active" aria-current="page" href="lecturer-classes.html"

              ><span>Lớp giảng dạy</span></a
            ><a href="lecturer-materials.html"
              ><span class="nav-icon"
                ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z" />
                  <path d="M14 3v5h5M9 13h6M9 17h4" /></svg></span
              ><span>Tài liệu</span></a
            ><a href="lecturer-stats.html"
              ><span class="nav-icon"
                ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg></span
              ><span>Thống kê</span></a
            >
          </nav>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="top-actions">
            <label class="search"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" /></svg
              ><span class="sr-only" hidden>Tìm kiếm</span
              ><input type="search" placeholder="Tìm kiếm…" aria-label="Tìm kiếm"
            /></label>
            <div class="notif-wrap">
              <button class="icon-btn notif-btn-api" aria-label="Thông báo">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" />
                  <path d="M10 20a2 2 0 0 0 4 0" /></svg
                ><i class="dot"></i>
              </button>
            </div>
            <div class="user-menu">
              <button class="user" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="avatar"></span><span class="name"><b>Đang tải…</b></span
                ><svg class="ud-chev" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
              <div class="user-dropdown" role="menu">
                <div class="ud-head">
                  <span class="avatar"></span>
                  <div><b class="ud-name">Đang tải…</b><small class="ud-email"></small></div>
                </div>
                <a role="menuitem" href="profile.html?role=lecturer"
                  ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21a8 8 0 0 1 16 0" /></svg
                  >Hồ sơ cá nhân</a
                ><a role="menuitem" href="login.html" class="ud-logout"
                  ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"
                    /></svg
                  >Đăng xuất</a
                >
              </div>
            </div>
          </div>
        </header>
        <div class="page">
          <section class="mat-hero page-hero">
            <div class="ph-text">
              <div class="eyebrow">LỚP HỌC</div>
              <h1>Lớp giảng dạy</h1>
              <p id="clsCount">Các lớp bạn phụ trách trong học kỳ.</p>
            </div>
            <svg class="mh-art" viewBox="0 0 310 150" aria-hidden="true">
              <defs>
                <linearGradient id="hb1" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#5AA8F0" />
                  <stop offset="1" stop-color="#1E5FB8" />
                </linearGradient>
                <linearGradient id="hb2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#2F6FC4" />
                  <stop offset="1" stop-color="#173F7E" />
                </linearGradient>
                <linearGradient id="hb3" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#8DBDF0" />
                  <stop offset="1" stop-color="#5C97DD" />
                </linearGradient>
                <linearGradient id="hpg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#FFFFFF" />
                  <stop offset="1" stop-color="#E6EFFA" />
                </linearGradient>
                <linearGradient id="hor" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#F7C25A" />
                  <stop offset="1" stop-color="#EE9A2E" />
                </linearGradient>
                <linearGradient id="hlf" x1="0" y1="1" x2="0" y2="0">
                  <stop offset="0" stop-color="#BFD8F5" />
                  <stop offset="1" stop-color="#E4EFFB" />
                </linearGradient>
              </defs>
              <g fill="url(#hlf)">
                <path d="M40 150c-6-30 6-58 30-72-4 26-12 50-30 72z" />
                <path d="M28 150c-20-16-30-38-26-60 16 14 24 34 26 60z" />
                <path d="M262 150c6-28-4-56-26-72 2 26 10 50 26 72z" />
                <path d="M274 150c18-18 26-40 20-62-14 16-20 36-20 62z" />
              </g>
              <ellipse cx="155" cy="146" rx="100" ry="6" fill="#E3ECF7" />
              <rect x="78" y="10" width="154" height="98" rx="10" fill="url(#hb2)" />
              <rect x="86" y="18" width="138" height="82" rx="6" fill="url(#hb1)" />
              <rect x="102" y="66" width="16" height="22" rx="3" fill="#D8E9FA" />
              <rect x="124" y="52" width="16" height="36" rx="3" fill="#D8E9FA" />
              <rect x="146" y="38" width="16" height="50" rx="3" fill="url(#hor)" />
              <path
                d="M174 38h34M174 50h26M174 62h30"
                stroke="#D8E9FA"
                stroke-width="5"
                stroke-linecap="round"
              />
              <path
                d="M126 108l-12 34M184 108l12 34"
                stroke="#173F7E"
                stroke-width="6"
                stroke-linecap="round"
              />
            </svg>
          </section>
          <div class="filters" data-filter-list="#lecClasses" data-live>
            <div class="field">
              <label for="lq">Tìm lớp</label
              ><input id="lq" data-key="q" placeholder="Tên lớp, môn học, mã tham gia…" />
            </div>
            <button class="btn primary tb-add" data-modal="classModal">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" /></svg
              >Tạo lớp
            </button>
          </div>
          <div class="grid2" id="lecClasses">
            <div class="loading">
              <span class="typing"><i></i><i></i><i></i></span> Đang tải…
            </div>
          </div>
          <p class="empty-filter" hidden>Không có lớp nào khớp.</p>
          <div
            class="modal"
            id="classModal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="classModal-t"
          >
            <div class="modal-card">
              <div class="between modal-top">
                <h2 id="classModal-t" class="modal-title">Tạo lớp học</h2>
                <button
                  class="btn sm icon-only"
                  onclick="closeModal('classModal')"
                  aria-label="Đóng"
                >
                  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12M18 6 6 18" />
                  </svg>
                </button>
              </div>
              <div class="form-grid">
                <div class="field">
                  <label for="ncCode">Tên lớp</label><input id="ncCode" placeholder="VD: KTPM_02" />
                </div>
                <div class="field">
                  <label for="ncSubject">Môn học</label
                  ><input id="ncSubject" placeholder="VD: Kiểm thử phần mềm" />
                </div>
                <div class="field">
                  <label for="ncStart">Ngày bắt đầu học</label><input id="ncStart" type="date" />
                </div>
                <div class="field">
                  <label for="ncType">Loại học phần</label
                  ><select id="ncType">
                    <option value="regular">Môn thường — 15 buổi</option>
                    <option value="political">Lý luận chính trị — 10 buổi</option>
                  </select>
                </div>
              </div>
              <div class="field" id="ncDaysWrap" hidden style="margin-top: 12px">
                <label>Thứ học trong tuần (kỳ Hè: chọn đúng 3 thứ)</label>
                <div class="day-picks">
                  <label><input type="checkbox" value="0" /> Thứ Hai</label
                  ><label><input type="checkbox" value="1" /> Thứ Ba</label
                  ><label><input type="checkbox" value="2" /> Thứ Tư</label
                  ><label><input type="checkbox" value="3" /> Thứ Năm</label
                  ><label><input type="checkbox" value="4" /> Thứ Sáu</label
                  ><label><input type="checkbox" value="5" /> Thứ Bảy</label>
                </div>
              </div>
              <p id="ncHint" hidden></p>
              <div class="modal-actions">
                <button class="btn" onclick="closeModal('classModal')">Hủy</button
                ><button class="btn primary" data-submit="createClass">Tạo lớp</button>
              </div>
            </div>
          </div>
          <div
            class="modal"
            id="editClassModal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="editClassModal-t"
          >
            <div class="modal-card">
              <div class="between modal-top">
                <h2 id="editClassModal-t" class="modal-title">Sửa lớp học</h2>
                <button
                  class="btn sm icon-only"
                  onclick="closeModal('editClassModal')"
                  aria-label="Đóng"
                >
                  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12M18 6 6 18" />
                  </svg>
                </button>
              </div>
              <input type="hidden" name="classId" id="ecId" />
              <div class="form-grid">
                <div class="field">
                  <label for="ecCode">Tên lớp</label><input id="ecCode" name="code" />
                </div>
                <div class="field">
                  <label for="ecSubject">Môn học</label><input id="ecSubject" name="subject" />
                </div>
              </div>
              <div class="field" style="margin-top: 14px">
                <label for="ecJoin">Mã tham gia</label>
                <div class="row" style="flex-wrap: nowrap">
                  <input id="ecJoin" name="join_code" readonly style="flex: 1" /><button
                    class="btn"
                    type="button"
                    data-submit="regenCode"
                  >
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg
                    >Tạo mã mới
                  </button>
                </div>
              </div>
              <div class="modal-actions">
                <button class="btn" onclick="closeModal('editClassModal')">Hủy</button
                ><button class="btn primary" data-submit="saveClass">Lưu</button>
              </div>
            </div>
          </div>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast"></div>

    <script src="assets/js/shared/questions.js?v=3.26"></script>
    <script src="assets/js/shared/ai-widget.js?v=3.26"></script>
    <script src="assets/js/pages/lecturer/classes.js?v=3.26"></script>
    <script src="assets/js/core/boot.js?v=3.26"></script>
